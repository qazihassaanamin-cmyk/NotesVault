{% extends "base.html" %}
{% block content %}
<div class="container my-4" style="max-width: 600px;">
    <h3>Upload New Resource</h3>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" required placeholder="e.g., Calculus II Integration Cheat Sheet">
        </div>
        <div class="mb-3">
            <label class="form-label">Subject</label>
            <select name="subject" class="form-select" required>
                <option value="Calculus">Calculus</option>
                <option value="Physics">Physics</option>
                <option value="Python">Python</option>
                <option value="SQL">SQL</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Resource Link (Google Drive / GitHub / PDF URL)</label>
            <input type="url" name="resource_link" class="form-control" required>
        </div>
        
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="is_private" id="is_private">
            <label class="form-check-label" for="is_private">Make Private (Only visible on your account)</label>
        </div>

        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="is_paid" id="is_paid">
            <label class="form-check-label" for="is_paid">Set as Paid Resource</label>
        </div>
        <div class="mb-3">
            <input type="number" step="0.01" name="price" class="form-control" placeholder="Price in PKR (e.g., 250)">
        </div>

        <button type="submit" class="btn btn-primary w-100">Publish Resource</button>
    </form>
</div>
{% endblock %}
